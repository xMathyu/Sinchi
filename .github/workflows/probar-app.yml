name: Enviar a testers

# Builds de prueba: TestFlight (iOS, internos y externos) y la pista cerrada
# Alpha de Play (Android).
#
# NO HAY DISPARADOR AUTOMATICO, a proposito. Sin expo-updates cada envio es un
# binario completo — veinte a cuarenta minutos y un credito de EAS por
# plataforma. Un merge cualquiera no vale eso; una tanda de pruebas si. Se
# dispara desde Actions, o con `gh workflow run probar-app.yml`, cuando hay algo
# que probar.
#
# POR QUE ALPHA Y NO EL CANAL INTERNO DE PLAY. El interno llega en segundos,
# pero el requisito de la cuenta personal —12 testers durante 14 dias seguidos
# antes de poder pedir produccion— solo cuenta pruebas CERRADAS. Un build que va
# al canal interno no mueve ese reloj. La pista esta configurada en
# `eas.json` (`submit.production.android.track`), no aqui.
#
# LAS DOS PLATAFORMAS USAN EL PERFIL `production`. TestFlight y las pistas de
# Play exigen binarios firmados para tienda; los de `preview` son
# `distribution: internal`, que es otra cosa — se instalan por enlace y no
# pasan por ninguna tienda.
#
# SIN SECRETOS EN GITHUB, igual que `deploy-api.yml`. EAS no habla OIDC, pero
# Google si: el runner entra a Google Cloud por federacion de identidad como
# `sinchi-deployer` y lee de Secret Manager el token del robot de Expo
# (`sinchi-expo-token`, «GitHub Actions (Sinchi)», rol Developer) y la llave de la
# App Store Connect API (`sinchi-asc-api-key`). Hasta el 2026-09-13 esto pedia
# `secrets.EXPO_TOKEN`, que nunca se creo: el workflow moria a los 37 segundos y
# todos los builds salian de la Mac.
#
# TESTERS EXTERNOS. `eas submit --groups` solo conoce grupos INTERNOS. Llevar el
# build al grupo externo «Testers abiertos» —el del enlace publico— y pedir Beta
# App Review lo hace `.github/scripts/testflight-external.mjs`. Las notas de «Que
# probar» salen de `store/appstore/testflight-whats-new.txt`, que se escribe en el
# mismo commit que la funcion que describe.
#
# NOTAS EN PLAY. Del lado de Android pasa lo mismo por otro motivo: la config de
# Android de `eas submit` solo tiene pista, estado y rollout, asi que la release
# queda muda —la versionCode 6 lleva asi desde el 2026-09-08— y quien actualiza
# no se entera de que cambio. Se las pone `.github/scripts/play-release-notes.mjs`
# desde `store/play/release-notes.txt`, que es OTRO archivo y no el de TestFlight
# porque Play corta a 500 caracteres por idioma. Habla con la Play Developer API
# impersonando `play-publisher@` —la misma cuenta de servicio cuyo JSON usa EAS
# para subir el .aab—, no con una llave propia: `sinchi-deployer` tiene
# `serviceAccountTokenCreator` sobre ella, y asi ese JSON sigue viviendo en un
# solo lugar.

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Que compilar'
        type: choice
        options:
          - ambas
          - ios
          - android
        default: ambas
      externos:
        description: 'iOS: llevarlo tambien a los testers externos (grupo «Testers abiertos» y Beta App Review)'
        type: boolean
        default: true
      build_id:
        description: 'ID de un build de EAS ya compilado para enviarlo sin compilar otra vez. Vacio = compilar.'
        type: string
        required: false
        default: ''

concurrency:
  # Comparte contador de build number con `publicar-ios.yml`: dos envios a la
  # vez y el segundo sale con el numero del primero.
  group: builds-tienda
  cancel-in-progress: false

jobs:
  # Un job de una linea para traducir el desplegable a la matriz del siguiente.
  # `strategy.matrix` no acepta condicionales, asi que la lista se arma antes.
  elegir:
    runs-on: ubuntu-latest
    outputs:
      plataformas: ${{ steps.lista.outputs.plataformas }}
    steps:
      - id: lista
        env:
          PLATAFORMA: ${{ inputs.plataforma }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          # Un build de EAS es de UNA plataforma: reenviarlo a las dos subiria un
          # .ipa a Play, y eso se descubre despues de media hora de cola.
          if [ -n "$BUILD_ID" ] && [ "$PLATAFORMA" = "ambas" ]; then
            echo "::error::build_id es de una sola plataforma: elige ios o android."
            exit 1
          fi
          case "$PLATAFORMA" in
            ios)     echo 'plataformas=["ios"]'           >> "$GITHUB_OUTPUT" ;;
            android) echo 'plataformas=["android"]'       >> "$GITHUB_OUTPUT" ;;
            *)       echo 'plataformas=["ios","android"]' >> "$GITHUB_OUTPUT" ;;
          esac

  enviar:
    needs: elegir
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para pedir el token OIDC con el que se entra a Secret Manager. Sin esto la
      # federacion responde un 403 que no explica nada.
      id-token: write
    strategy:
      # Sin fail-fast: que iOS falle no es razon para tirar el build de Android
      # que ya lleva media hora en la cola de EAS.
      fail-fast: false
      matrix:
        plataforma: ${{ fromJson(needs.elegir.outputs.plataformas) }}
    name: ${{ matrix.plataforma }}
    env:
      PROJECT_ID: sinchi-a95913
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` SI hace falta, aunque el binario lo compile EAS en su maquina.
      # `eas` lee app.json aqui, en el runner, y resuelve sus config plugins
      # (`expo-router`, `expo-camera`...) desde node_modules. Sin ellos `eas
      # submit` muere con «Failed to resolve plugin for module "expo-router"» y un
      # «submit command failed» que no dice nada mas. Paso el 2026-09-13, en el
      # primer envio desde Actions: hasta entonces todo salia de la Mac, que tiene
      # node_modules, y el comentario que decia «sin npm ci» nunca se puso a prueba.
      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/961173851857/locations/global/workloadIdentityPools/github/providers/github
          service_account: sinchi-deployer@sinchi-a95913.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Token de Expo desde Secret Manager
        run: |
          token=$(gcloud secrets versions access latest --secret=sinchi-expo-token --project="$PROJECT_ID")
          echo "::add-mask::$token"
          echo "EXPO_TOKEN=$token" >> "$GITHUB_ENV"

      # Sin `token:` aqui: `eas` lo toma de EXPO_TOKEN, que ya esta en el entorno.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest

      - name: Compilar
        id: compilar
        if: inputs.build_id == ''
        working-directory: apps/mobile
        env:
          PLATAFORMA: ${{ matrix.plataforma }}
        run: |
          eas build --platform "$PLATAFORMA" --profile production --non-interactive --wait --json > build.json
          echo "id=$(node -p "require('./build.json')[0].id")" >> "$GITHUB_OUTPUT"

      - name: Enviar
        id: enviar
        working-directory: apps/mobile
        env:
          PLATAFORMA: ${{ matrix.plataforma }}
          BUILD_ID: ${{ inputs.build_id || steps.compilar.outputs.id }}
        # `--id` y no `--latest`: con dos builds en vuelo, «el ultimo» puede ser el
        # de otra plataforma o el de otra corrida. iOS aterriza en TestFlight y los
        # internos lo ven sin revision; Android va a la pista que diga eas.json.
        run: |
          eas submit --platform "$PLATAFORMA" --id "$BUILD_ID" --non-interactive --wait
          numero=$(eas build:view "$BUILD_ID" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s.slice(s.indexOf("{"))).appBuildVersion))')
          echo "Build $numero"
          echo "build_number=$numero" >> "$GITHUB_OUTPUT"

      # El equivalente de Android del paso de «Que probar» de abajo. `eas submit`
      # crea la release en la pista pero no sabe escribir notas, y una release
      # muda no le dice al tester que cambio. Va por impersonacion de
      # `play-publisher@` —la misma cuenta cuyo JSON usa EAS— y no por una llave:
      # asi no hay un segundo JSON que rotar ni un secreto en GitHub.
      - name: Notas de la release en Play
        if: matrix.plataforma == 'android'
        env:
          PLAY_VERSION_CODE: ${{ steps.enviar.outputs.build_number }}
          RELEASE_NOTES_PATH: store/play/release-notes.txt
        run: |
          token=$(gcloud auth print-access-token \
            --impersonate-service-account=play-publisher@sinchi-a95913.iam.gserviceaccount.com \
            --scopes=https://www.googleapis.com/auth/androidpublisher)
          echo "::add-mask::$token"
          PLAY_TOKEN="$token" node .github/scripts/play-release-notes.mjs

      - name: Testers externos
        if: matrix.plataforma == 'ios' && inputs.externos
        env:
          ASC_KEY_ID: Z5299M485J
          ASC_ISSUER_ID: b214adce-26ba-4066-a67d-46485b40652e
          ASC_APP_ID: '6809297841'
          ASC_EXTERNAL_GROUP: Testers abiertos
          BUILD_NUMBER: ${{ steps.enviar.outputs.build_number }}
          WHATS_NEW_PATH: store/appstore/testflight-whats-new.txt
        run: |
          gcloud secrets versions access latest --secret=sinchi-asc-api-key --project="$PROJECT_ID" > "$RUNNER_TEMP/asc.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" node .github/scripts/testflight-external.mjs
